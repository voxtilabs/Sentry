plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'cl.voxtilabs.sentryocr'
version = '1.0.0'
android {
  namespace 'cl.voxtilabs.sentryocr'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  // Modelo latino incluido: funciona desde el primer uso en modo avión.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
