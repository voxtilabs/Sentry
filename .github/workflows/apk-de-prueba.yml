# APK de prueba, a demanda y sin cola.
#
# Existe porque EAS es la via correcta para lo que se PUBLICA —administra el
# keystore real, que es lo unico irreversible del proyecto— pero su cola gratuita
# tarda entre 10 y 25 minutos. Para "quiero ver si esto funciona en el emulador"
# eso es demasiado.
#
# Aca sale un APK **firmado con la clave de DEPURACION**: se instala en cualquier
# telefono o emulador, y NO sirve para Play Store. Es a proposito. Mezclar las dos
# cosas es como se pierde el control de la firma, y dos builds con claves
# distintas no se pueden actualizar entre si.
#
# Lo mismo que hace `Tamano de la app Android`, pero con `assembleRelease` en vez
# de `bundleRelease`: un APK se instala, un AAB no.
# Build para verificar los permisos en contexto y el volcado de cookies.
name: APK de prueba

on:
  workflow_dispatch:
    inputs:
      portal:
        description: 'A que portal apunta la app'
        required: true
        default: 'https://test-sentrycore.voxtilabs.cl'
      qa_package:
        description: 'Instalar junto a la app de Play Store (paquete .qa)'
        type: boolean
        default: false
  # A demanda: este workflow ya existe en main. Compilar en cada actualización
  # del PR repetía veinte minutos de Gradle incluso por cambios del servidor.

permissions:
  contents: read

concurrency:
  group: apk-prueba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: construir el APK instalable
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # `packages` acotado a proposito: el valor por defecto del action es
      # `tools platform-tools`, y `tools` es el SDK viejo que Google retiro.
      # Desde que el runner trae cmdline-tools 16, sdkmanager responde
      # "Failed to find package 'tools'" y la compilacion muere antes de
      # empezar. Gradle baja solo la plataforma y las build-tools que pide el
      # proyecto, asi que aqui basta con platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # apps/mobile va FUERA de los workspaces de npm a proposito (Metro no se
      # lleva bien con el hoisting), asi que se instala por su cuenta.
      - name: Instalar dependencias
        run: npm ci

      # El portal entra como DATO por el entorno, nunca interpolado dentro del
      # shell (#296). El respaldo importa: en el gatillo por PR no hay `inputs`,
      # asi que sin el la URL llegaria vacia y el build se caeria aca.
      - name: Validar el origen del portal
        env:
          PORTAL_URL: ${{ inputs.portal || 'https://test-sentrycore.voxtilabs.cl' }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.PORTAL_URL ?? '';
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error('El portal debe ser una URL valida');
          }
          const esOrigenExacto = raw === url.origin || raw === `${url.origin}/`;
          if (
            url.protocol !== 'https:' ||
            url.username ||
            url.password ||
            !esOrigenExacto
          ) {
            throw new Error('El portal debe ser un origen HTTPS sin credenciales, ruta, query ni fragmento');
          }
          NODE

      # android/ esta en .gitignore: el flujo es CNG y la fuente de verdad es
      # app.config.ts. Se regenera en cada corrida.
      #
      # NODE_ENV=production apaga el trafico en claro, igual que en un build de
      # tienda: es justo lo que se rompe fuera de debug y hay que verlo aca.
      - name: Generar el proyecto Android
        env:
          NODE_ENV: production
          SENTRYCORE_QA_BUILD: ${{ inputs.qa_package && '1' || '0' }}
          EXPO_PUBLIC_DEPURABLE: '1'
          EXPO_PUBLIC_WEB_URL: ${{ inputs.portal || 'https://test-sentrycore.voxtilabs.cl' }}
        run: npx expo prebuild --platform android --clean --no-install

      # setup-java va DESPUES del prebuild: con `cache: gradle` busca **/*.gradle
      # para la llave de cache, y antes del prebuild esos archivos no existen.
      # Al reves fallaba con "No file matched" y tumbaba el job entero.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # EXPO_PUBLIC_* se hornea al EMPAQUETAR el JS, y el bundle corre DENTRO
      # de gradle — no en el prebuild. Solo en el prebuild, la app salia
      # apuntando al default HTTP del emulador y su guardia de arranque la
      # mataba con "debe usar HTTPS". Descubierto en el primer uso real del
      # workflow: nunca habia podido correrse (workflow_dispatch exige main).
      - name: Construir el APK
        working-directory: apps/mobile/android
        env:
          SENTRYCORE_QA_BUILD: ${{ inputs.qa_package && '1' || '0' }}
          EXPO_PUBLIC_DEPURABLE: '1'
          EXPO_PUBLIC_WEB_URL: ${{ inputs.portal || 'https://test-sentrycore.voxtilabs.cl' }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: sentrycore-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Como instalarlo
        env:
          PORTAL_URL: ${{ inputs.portal || 'https://test-sentrycore.voxtilabs.cl' }}
        run: |
          echo "### APK listo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Descargalo del artefacto **sentrycore-apk** de esta corrida." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf 'Apunta a: `%s`\n' "$PORTAL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Firmado con la clave de **depuracion**: se instala en emulador y" >> "$GITHUB_STEP_SUMMARY"
          echo "telefono, pero **no** sirve para Play Store. Para publicar se usa" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS, que administra el keystore real." >> "$GITHUB_STEP_SUMMARY"
